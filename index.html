<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>上海 ― 牌消しパズル</title>
<style>
body{margin:0;background:#0d3b2e;color:#f3e9d2;font-family:serif;text-align:center;-webkit-tap-highlight-color:transparent}
#w{max-width:560px;margin:auto;padding:10px}
h1{font-size:19px;letter-spacing:.12em;margin:4px}
.s{font-size:12px;color:#bcd8c8}
#st{min-height:24px;font-size:14px;margin:8px 2px;white-space:pre-wrap}
#board{position:relative;width:100%;aspect-ratio:1/1.02;background:#0a2f24;border:2px solid #8a6b3f;border-radius:8px}
.t{position:absolute;background:#f7f2df;border:1px solid #8a8a7a;border-bottom:3px solid #b0a888;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;color:#222;line-height:1.05}
.t .n{font-size:min(4.4vw,20px);font-weight:bold}
.t .k{font-size:min(4vw,18px)}
.t .j{font-size:min(6.4vw,30px);font-weight:bold}
.t.man .k{color:#333}.t.sou .k{color:#1d7a3a}.t.pin .k{color:#2050a0}
.t .chu{color:#c0272d}.t .hatsu{color:#1d7a3a}
.t.lock{filter:brightness(.72)}
.t.sel{outline:3px solid #e8a34f;background:#fff3cf}
.t.hint{outline:3px solid #7fd48a}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
button.act{font-size:14px;padding:9px 18px;background:#7c2128;color:#fff;border:1px solid #d8b46a;border-radius:6px;letter-spacing:.1em;font-family:inherit;cursor:pointer}
.note{font-size:11px;color:#9fc4ae;line-height:1.7;text-align:left;margin-top:12px}
</style></head><body><div id="w">
<h1>上海 ― 牌消し</h1>
<div class="s">取れる牌のうち、同じ絵の2枚を選んで消していくパズル。</div>
<div id="st"></div>
<div id="board"></div>
<div class="row">
<button class="act" id="hint">ヒント</button>
<button class="act" id="shuffle">シャッフル</button>
<button class="act" id="restart">最初から</button>
</div>
<div class="note">・牌が「取れる」条件: 上に牌が乗っていない、かつ左右どちらかが空いていること<br>・暗くなっている牌は今は取れません<br>・手詰まりになったらシャッフルを使ってください。全て消せばクリア</div>
</div><script>
"use strict";
//CORE-START
function layout(){
 const P=[];
 for(let r=0;r<6;r++)for(let c=0;c<8;c++)P.push({l:0,r:r,c:c});
 for(let r=1;r<5;r++)for(let c=2;c<6;c++)P.push({l:1,r:r,c:c});
 return P;
}
function key(p){return p.l+","+p.r+","+p.c}
function isFree(p,rem){
 for(const q of rem)if(q.l===p.l+1&&q.r===p.r&&q.c===p.c)return false;
 let left=false,right=false;
 for(const q of rem){if(q.l===p.l&&q.r===p.r){if(q.c===p.c-1)left=true;if(q.c===p.c+1)right=true}}
 return !left||!right;
}
function generate(){
 const P=layout();
 for(let attempt=0;attempt<60;attempt++){
  const rem=new Set(P);const assign=new Map();
  const types=[];for(let t=0;t<32;t++)types.push(t);
  for(let i=types.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[types[i],types[j]]=[types[j],types[i]]}
  let ti=0,ok=true;
  while(rem.size>0){
   const free=[...rem].filter(p=>isFree(p,rem));
   if(free.length<2){ok=false;break}
   const a=free[(Math.random()*free.length)|0];rem.delete(a);
   const free2=[...rem].filter(p=>isFree(p,rem));
   if(free2.length<1){ok=false;break}
   const b=free2[(Math.random()*free2.length)|0];rem.delete(b);
   assign.set(key(a),types[ti]);assign.set(key(b),types[ti]);ti++;
  }
  if(ok)return{P:P,assign:assign};
 }
 return null;
}
//CORE-END
const KANJI=["萬","索","筒"],SUITS=["man","sou","pin"],JI=["東","南","西","北","中"],JICLS=["","","","","chu"];
function tileHTML(t){
 if(t<27)return '<span class="n">'+(t%9+1)+'</span><span class="k">'+KANJI[(t/9)|0]+"</span>";
 const j=t-27;return '<span class="j '+JICLS[j]+'">'+JI[j]+"</span>";
}
function tileCls(t){return t<27?SUITS[(t/9)|0]:"ji"}
let P=[],assign=new Map(),gone=new Set(),sel=null,startAt=null,timerId=null,removedPairs=0;
const board=document.getElementById("board"),stEl=document.getElementById("st");
function remaining(){return P.filter(p=>!gone.has(key(p)))}
function elapsed(){if(!startAt)return 0;return ((Date.now()-startAt)/1000)|0}
function status(extra){
 const left=P.length-gone.size;
 let s="残り "+left+" 枚　消したペア "+removedPairs+"　時間 "+elapsed()+" 秒";
 if(extra)s+="\n"+extra;
 stEl.textContent=s;
}
function render(){
 board.innerHTML="";
 const rem=remaining();
 for(const p of P){
  const k=key(p);if(gone.has(k))continue;
  const d=document.createElement("div");
  d.className="t "+tileCls(assign.get(k))+(isFree(p,rem)?"":" lock");
  const w=11.6,h=15.2;
  d.style.width=w+"%";d.style.height=h+"%";
  d.style.left=(p.c*12.3+(p.l?5.4:0.4))+"%";
  d.style.top=(p.r*16.2+(p.l?-1.6:0.6))+"%";
  d.style.zIndex=p.l*10+p.r;
  if(sel===k)d.classList.add("sel");
  d.innerHTML=tileHTML(assign.get(k));
  d.onclick=()=>tap(p);
  board.appendChild(d);
 }
 status();
}
function findPair(){
 const rem=remaining(),free=rem.filter(p=>isFree(p,rem));
 for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)
  if(assign.get(key(free[i]))===assign.get(key(free[j])))return[free[i],free[j]];
 return null;
}
function tap(p){
 if(!startAt){startAt=Date.now();timerId=setInterval(status,1000)}
 const rem=remaining();
 if(!isFree(p,rem)){status("その牌は今は取れません");return}
 const k=key(p);
 if(sel===k){sel=null;render();return}
 if(sel===null){sel=k;render();return}
 if(assign.get(sel)===assign.get(k)){
  gone.add(sel);gone.add(k);sel=null;removedPairs++;
  if(gone.size===P.length){clearInterval(timerId);render();stEl.textContent="全消しクリア！ "+elapsed()+" 秒でした";return}
  render();
  if(!findPair())status("手詰まりです。シャッフルしてください");
 }else{sel=k;render()}
}
document.getElementById("hint").onclick=()=>{
 const pr=findPair();
 if(!pr){status("今は消せるペアがありません");return}
 render();
 const targets=new Set(pr.map(key));
 let n=0;
 for(const q of P){const k=key(q);if(gone.has(k))continue;if(targets.has(k))board.children[n].classList.add("hint");n++}
};
document.getElementById("shuffle").onclick=()=>{
 const rem=remaining(),ts=rem.map(p=>assign.get(key(p)));
 for(let i=ts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[ts[i],ts[j]]=[ts[j],ts[i]]}
 rem.forEach((p,i)=>assign.set(key(p),ts[i]));
 sel=null;render();status("シャッフルしました");
};
function start(){
 const g=generate();if(!g){stEl.textContent="生成に失敗しました。最初からを押してください";return}
 P=g.P;assign=g.assign;gone=new Set();sel=null;startAt=null;removedPairs=0;
 if(timerId)clearInterval(timerId);
 render();
}
document.getElementById("restart").onclick=start;
start();
</script></body></html>
